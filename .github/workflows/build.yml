name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ~/.local/share/godot/keystores
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.local/share/godot/keystores/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cd scp-sml
          mkdir -p build
          godot --headless --export-debug "Android" build/SCP_Breach.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SCP_Breach_APK
          path: scp-sml/build/SCP_Breach.apk
